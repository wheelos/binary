name: LiveKit SDK release

on:
  pull_request:
    paths:
      - 'libraries/livekit_sdk/**'
      - 'scripts/**'
      - 'platforms.json'
      - '.github/workflows/livekit-sdk-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Independent SDK release version
        required: true
        default: '1.13.0-wheelos.2'
      publish:
        description: Upload validated packages to R2
        type: boolean
        default: false
  push:
    tags:
      - 'livekit_sdk/v*'

permissions:
  contents: read

concurrency:
  group: livekit-sdk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_DOWNLOAD_BASE_URL: https://dl.wheelos.cn
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CARGO_BUILD_JOBS: '2'
  CC: clang-21
  CXX: clang++-21
  LIBCLANG_PATH: /usr/lib/llvm-21/lib

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve enabled targets and release version
        id: release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          matrix="$(python3 scripts/binary_release.py matrix --library livekit_sdk)"
          version="$(python3 scripts/binary_release.py version --library livekit_sdk)"
          printf 'matrix=%s\nversion=%s\n' "${matrix}" "${version}" >> "${GITHUB_OUTPUT}"

  build-and-test:
    needs: plan
    container:
      image: ubuntu:20.04
    env:
      BINARY_PLATFORM: ${{ matrix.platform }}
      BINARY_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    name: Build and test (${{ matrix.platform }})
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git git-lfs python3

      - uses: actions/checkout@v4

      - name: Verify native runner architecture
        run: python3 scripts/binary_release.py native --library livekit_sdk

      - name: Resolve pinned LiveKit source commit
        id: source
        run: |
          commit="$(python3 -c 'import json; print(json.load(open("libraries/livekit_sdk/metadata.json"))["upstream_commit"])')"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          repository: livekit/client-sdk-cpp
          ref: ${{ steps.source.outputs.commit }}
          path: livekit-source
          submodules: recursive
          persist-credentials: false

      - name: Set Cargo output root
        run: echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE}/livekit-source/client-sdk-rust/target" >> "${GITHUB_ENV}"

      - name: Pull LiveKit LFS files
        working-directory: livekit-source
        run: git lfs pull

      - name: Stabilize Rust source mtimes for Cargo cache
        run: find livekit-source/client-sdk-rust -type f -not -path '*/.git/*' -exec touch -t 202001010000 {} +

      - name: Install LiveKit build dependencies
        run: bash libraries/livekit_sdk/install-deps.sh

      - name: Verify glibc baseline
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.97.1'

      - name: Resolve Rust submodule commit
        id: rust
        run: |
          sha="$(git -C livekit-source/client-sdk-rust rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            livekit-source/client-sdk-rust/target/
          key: ${{ runner.os }}-${{ matrix.platform }}-livekit-cargo-rust1.97.1-clang21-${{ steps.rust.outputs.sha }}

      - name: Set LiveKit Linux build environment
        run: |
          echo "CXXFLAGS=-Wno-deprecated-declarations" >> "${GITHUB_ENV}"
          echo "CFLAGS=-Wno-deprecated-declarations" >> "${GITHUB_ENV}"
          test -f "${LIBCLANG_PATH}/libclang.so"

      - name: Test release metadata and packaging tools
        run: |
          python3 -m unittest discover -s libraries/livekit_sdk -p '*test.py' -v
          python3 -m unittest discover -s scripts -p '*test.py' -v

      - name: Build LiveKit SDK from source
        env:
          LIVEKIT_SOURCE_DIR: ${{ github.workspace }}/livekit-source
          LIVEKIT_VERSION: ${{ needs.plan.outputs.version }}
        run: libraries/livekit_sdk/build.sh

      - name: Test installed SDK bundle
        env:
          LIVEKIT_SOURCE_DIR: ${{ github.workspace }}/livekit-source
          LIVEKIT_VERSION: ${{ needs.plan.outputs.version }}
        run: libraries/livekit_sdk/test.sh

      - name: Package deterministic SDK archive
        env:
          LIVEKIT_VERSION: ${{ needs.plan.outputs.version }}
          LIVEKIT_PLATFORM: ${{ matrix.platform }}
        run: |
          LIVEKIT_RUSTC_VERSION="$(rustc --version)" \
          LIVEKIT_CARGO_VERSION="$(cargo --version)" \
          LIVEKIT_CMAKE_VERSION="$(cmake --version | head -n 1)" \
          python3 libraries/livekit_sdk/package.py \
            --bundle libraries/livekit_sdk/dist/sdk \
            --version "${LIVEKIT_VERSION}" \
            --output "libraries/livekit_sdk/dist/livekit-sdk-${LIVEKIT_VERSION}-${LIVEKIT_PLATFORM}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: livekit-sdk-${{ matrix.platform }}
          path: libraries/livekit_sdk/dist/livekit-sdk-${{ needs.plan.outputs.version }}-${{ matrix.platform }}.tar.gz*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/livekit_sdk/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [plan, build-and-test]
    runs-on: ubuntu-latest
    environment: binary-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: livekit-sdk-*
          path: dist/artifacts
          merge-multiple: true

      - name: Upload immutable SDK packages to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET_NAME || vars.R2_BUCKET || 'wheelos-assets' }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 scripts/binary_release.py publish --library livekit_sdk \
            --version "${RELEASE_VERSION}" --directory dist/artifacts
